<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recortador de Audios Web</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      background-color: #2b8cbe;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background-color: #a0c4d6; }
    #status { margin-top: 15px; font-size: 0.9em; color: #555; word-break: break-all; }
  </style>
  <!-- FFmpeg WebAssembly -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

<div class="card">
  <h2>Recortador de Audios Web</h2>
  <p style="font-size: 0.85em; color: #666;">Selecciona varios audios para eliminar los primeros minutos en lote.</p>

  <div class="input-group">
    <label for="cutTime">Tiempo a recortar (HH:MM:SS):</label>
    <input type="text" id="cutTime" value="00:05:10">
  </div>

  <div class="input-group">
    <label for="audioFiles">Seleccionar Audios:</label>
    <input type="file" id="audioFiles" multiple accept="audio/*">
  </div>

  <button id="processBtn" onclick="procesarAudios()">Iniciar Recorte en Lote</button>

  <div id="status">Estado: Listo para procesar</div>
</div>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;
  const ffmpeg = createFFmpeg({ log: true });

  async function procesarAudios() {
    const filesInput = document.getElementById('audioFiles');
    const cutTime = document.getElementById('cutTime').value.trim();
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('processBtn');

    if (!filesInput.files.length) {
      alert("Por favor selecciona al menos un archivo de audio.");
      return;
    }

    btn.disabled = true;
    statusDiv.innerText = "Cargando motor de procesamiento (FFmpeg)...";

    // Cargar la librería FFmpeg WASM si aún no está cargada
    if (!ffmpeg.isLoaded()) {
      await ffmpeg.load();
    }

    const files = Array.from(filesInput.files);
    let exitos = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      statusDiv.innerText = `Procesando [${i + 1}/${files.length}]: ${file.name}`;

      const inputName = `input_${file.name}`;
      const outputName = `recortado_${file.name}`;

      // 1. Cargar archivo al sistema de archivos virtual de FFmpeg
      ffmpeg.FS('writeFile', inputName, await fetchFile(file));

      // 2. Ejecutar comando para recortar (-ss 00:05:10 -c copy)
      await ffmpeg.run('-y', '-ss', cutTime, '-i', inputName, '-c', 'copy', outputName);

      // 3. Leer el resultado generado
      const data = ffmpeg.FS('readFile', outputName);

      // 4. Descargar automáticamente el nuevo archivo al celular
      const blob = new Blob([data.buffer], { type: file.type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `recortado_${file.name}`;
      a.click();

      // Limpiar memoria
      ffmpeg.FS('unlink', inputName);
      ffmpeg.FS('unlink', outputName);
      exitos++;
    }

    statusDiv.innerText = `¡Proceso finalizado! Archivos procesados y descargados: ${exitos}`;
    btn.disabled = false;
  }
</script>

</body>
</html>
